<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#070707">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Beat Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23070707'/%3E%3Cg stroke='%23ff3737' stroke-width='6' stroke-linecap='round' fill='none'%3E%3Cpath d='M12 50 h8 v0 M24 50 v-14 M24 50 v14 M36 50 v-24 M36 50 v24 M48 50 v-34 M48 50 v34 M60 50 v-20 M60 50 v20 M72 50 v-30 M72 50 v30 M84 50 v-10 M84 50 v10'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{--bg:#070707;--card:#181818;--line:#363636;--text:#f8f8f8;--muted:#a0a0a0;--red:#ff3737;--red-dark:#511818;--green:#42dc99}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,sans-serif;min-height:100dvh}
.app{max-width:720px;min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 14px calc(104px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}
button{border:0;color:inherit;background:none;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.97)}
button:disabled{opacity:.4;pointer-events:none}
.header{display:flex;align-items:center;justify-content:space-between;padding:14px 2px}
.brand{font-size:21px;font-weight:900;letter-spacing:.05em}
.brand span{color:var(--red)}
.subtitle{display:block;max-width:230px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:600}
.icon-btn{width:42px;height:42px;border-radius:12px;background:#292929;font-size:18px}
.icon-btn.ghost{background:transparent;border:1px solid var(--line)}
.screen{display:none}
.screen.active{display:block}
h1{margin:16px 0 4px;font-size:29px}
.lead{margin:0 0 18px;color:var(--muted)}
.primary{width:100%;padding:16px;border-radius:15px;background:var(--red);font-size:16px;font-weight:850}
.project-list{display:grid;gap:11px;margin-top:18px}
.project{position:relative;padding:15px;border:1px solid var(--line);border-radius:15px;background:var(--card)}
.project-name{padding-right:35px;font-weight:850}
.project-meta{margin-top:5px;color:var(--muted);font-size:12px}
.wave-mini{height:28px;margin-top:10px;border-radius:6px;background:repeating-linear-gradient(90deg,transparent 0 4px,#ff494989 4px 6px,transparent 6px 10px)}
.delete{position:absolute;top:10px;right:10px;width:31px;height:31px;border-radius:8px;background:#2a2a2a;color:#bbb}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:3px 0 14px}
.tab{min-width:74px;flex:1;padding:10px;border-radius:10px;background:#202020;color:#aaa;font-size:13px;font-weight:850}
.tab.active{background:var(--red-dark);color:#fff}
.tab-page{display:none}
.tab-page.active{display:block}
.track{margin-bottom:11px;padding:12px;border:1px solid var(--line);border-left:4px solid var(--red);border-radius:14px;background:var(--card)}
.track.armed{border-left-color:#ff9d33;box-shadow:0 0 0 1px #ff9d3355}
.track-top{display:flex;gap:8px;align-items:center}
.track-title{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-weight:850}
.small-btn{min-width:32px;height:30px;padding:0 7px;border-radius:8px;background:#2c2c2c;font-size:11px;font-weight:850}
.small-btn.active{background:var(--red)}
.small-btn.solo-active{background:#e6c229;color:#111}
canvas{display:block;width:100%;height:58px;margin:11px 0 8px;border-radius:8px;background:#080808;touch-action:none}
.wave-row{position:relative}
.play-fab{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;background:#000c;border:1px solid #ff373766;color:var(--red);font-size:13px;display:flex;align-items:center;justify-content:center;z-index:2}
.control-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:var(--muted);font-size:11px}
.control-row label{display:grid;gap:4px}
input[type=range]{width:100%;accent-color:var(--red)}
.plugin-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
.plugin-chip{display:flex;align-items:center;gap:6px;padding:6px 9px;border-radius:20px;background:#241111;border:1px solid #5b1e1e;font-size:11px;font-weight:800;color:#ffb3b3}
.plugin-chip button{color:#ff9d9d;font-size:13px;line-height:1}
.add-plugin-chip{padding:6px 10px;border-radius:20px;background:#222;border:1px dashed #4a4a4a;font-size:11px;font-weight:800;color:#bbb}
.empty{padding:36px 15px;border:1px dashed #484848;border-radius:14px;text-align:center;color:var(--muted)}
.secondary{width:100%;padding:13px;border-radius:12px;background:#2d2d2d;font-weight:850}
.panel{margin-bottom:11px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.panel h3{margin:0 0 8px;font-size:15px}
.panel p{margin:0 0 11px;color:var(--muted);font-size:13px}
.field{width:100%;margin-bottom:10px;padding:12px;border:1px solid #484848;border-radius:10px;background:#0b0b0b;color:#fff}
.plugin-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid #292929}
.preset{width:100%;margin-top:8px;padding:13px;border:1px solid var(--line);border-radius:11px;background:#222;text-align:left}
.preset.selected{border-color:var(--red);background:#391515}
.preset small{display:block;margin-top:3px;color:var(--muted)}
.meter{display:flex;align-items:end;gap:8px;height:100px;margin:14px 0}
.meter-bar{width:50%;height:16%;border-radius:5px 5px 0 0;background:linear-gradient(var(--green),var(--red));transition:height .12s}
.dock{position:fixed;z-index:10;right:0;bottom:0;left:0;max-width:720px;margin:auto;padding:10px 14px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#111f;backdrop-filter:blur(15px)}
.time{text-align:center;margin-bottom:8px;font-variant-numeric:tabular-nums;font-weight:850}
.transport{display:grid;grid-template-columns:38px 38px 38px 1fr 44px 38px 38px 38px 38px;gap:6px}
.transport button{height:44px;border-radius:12px;background:#2b2b2b;font-weight:850;font-size:14px}
.transport .rec-btn{background:#5b1717;color:#ff9999}
.transport .rec-btn.recording{background:var(--red);color:#fff;animation:pulse 1s infinite}
.transport .play-btn{background:var(--red);font-size:18px}
.transport .ai-btn{background:linear-gradient(135deg,#3a1c5c,#7d2fbf);color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
.modal{position:fixed;z-index:30;inset:0;display:none;align-items:flex-end;background:#000a}
.modal.show{display:flex}
.modal-card{width:100%;max-width:720px;margin:auto;max-height:82vh;overflow-y:auto;padding:12px 15px calc(20px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;background:#1e1e1e}
.handle{width:38px;height:4px;margin:0 auto 17px;border-radius:5px;background:#666}
.modal h2{margin:0 0 13px;font-size:19px}
.option{width:100%;margin:7px 0;padding:15px;border-radius:11px;background:#2c2c2c;text-align:left;font-weight:850}
.option small{display:block;margin-top:3px;color:#aaa;font-weight:500}
.modal-actions{display:flex;gap:8px;margin-top:13px}
.modal-actions button{flex:1;padding:13px;border-radius:11px;background:#393939;font-weight:850}
.modal-actions .confirm{background:var(--red)}
.toast{position:fixed;z-index:50;bottom:114px;left:50%;padding:10px 13px;border-radius:10px;background:#f5f5f5;color:#111;transform:translate(-50%,80px);opacity:0;transition:.2s;white-space:nowrap;font-size:13px;font-weight:800;max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0);opacity:1}
.rec-badge{display:none;position:fixed;z-index:20;top:72px;right:16px;padding:4px 7px;border-radius:6px;background:#d92929;font-size:10px;font-weight:900}
.rec-badge.show{display:block}
.ai-card{padding:13px;margin-bottom:10px;border-radius:12px;background:#241a33;border:1px solid #4c2f77}
.ai-card h4{margin:0 0 4px;font-size:13px;color:#d8b8ff}
.ai-card p{margin:0 0 10px;font-size:12px;color:#bbb}
.ai-actions{display:flex;gap:8px}
.ai-actions button{flex:1;padding:9px;border-radius:9px;font-size:12px;font-weight:850}
.ai-actions .apply{background:#7d2fbf;color:#fff}
.ai-actions .dismiss{background:#333}
.export-row{display:flex;gap:8px}
.export-row button{flex:1}
</style>
</head>
<body>
<div class="app" id="app">

  <div class="screen active" id="screen-home">
    <div class="header">
      <div><div class="brand">BEAT<span>STUDIO</span></div></div>
      <button class="icon-btn ghost" id="homeSettingsBtn">⚙️</button>
    </div>
    <h1>Your sessions</h1>
    <p class="lead">Record, mix, and master anywhere.</p>
    <button class="primary" id="newSessionBtn">+ New session</button>
    <div class="project-list" id="projectList"></div>
  </div>

  <div class="screen" id="screen-studio">
    <div class="header">
      <div style="display:flex;align-items:center;gap:8px;min-width:0">
        <button class="icon-btn" id="backBtn">←</button>
        <div style="min-width:0">
          <div class="brand" style="font-size:16px" id="studioProjectName">Session</div>
          <span class="subtitle" id="studioProjectMeta">Saved just now</span>
        </div>
      </div>
      <button class="icon-btn ghost" id="renameBtn">✏️</button>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="tracks">Tracks</button>
      <button class="tab" data-tab="plugins">Plugins</button>
      <button class="tab" data-tab="mix">Mix</button>
      <button class="tab" data-tab="master">Master</button>
    </div>

    <div class="tab-page active" id="tab-tracks">
      <div id="trackList"></div>
      <div style="display:flex;gap:8px;margin-top:8px">
        <button class="secondary" id="addTrackBtn" style="flex:1">+ Add track</button>
        <button class="secondary" id="uploadTrackBtn" style="flex:1">⬆ Upload audio</button>
      </div>
    </div>

    <div class="tab-page" id="tab-plugins">
      <div class="panel">
        <h3>Effect chain by track</h3>
        <p>Pick a track, then add studio-style presets.</p>
        <select class="field" id="pluginTrackSelect"></select>
      </div>
      <div id="pluginTrackChain"></div>
      <button class="secondary" id="openPluginPickerBtn">+ Add plugin</button>
    </div>

    <div class="tab-page" id="tab-mix">
      <div class="panel">
        <h3>Automix</h3>
        <p>One tap to auto-balance every track's level.</p>
        <button class="primary" id="automixBtn">⚡ Run Automix</button>
      </div>
      <div id="mixList"></div>
    </div>

    <div class="tab-page" id="tab-master">
      <div class="panel">
        <h3>Master output</h3>
        <div class="meter"><div class="meter-bar" id="meterL"></div><div class="meter-bar" id="meterR"></div></div>
        <div id="masterPresets"></div>
      </div>
    </div>

    <div class="rec-badge" id="recBadge">● REC</div>
  </div>
</div>

<div class="dock" id="dock" style="display:none">
  <div class="time" id="transportTime">00:00 / 00:00</div>
  <div class="transport">
    <button id="micBtn" title="Record source">🎤</button>
    <button id="fxBtn" title="Quick add Fx">+Fx</button>
    <button id="autoPitchBtn" title="AutoPitch">AP</button>
    <button class="rec-btn" id="recBtn">● REC</button>
    <button class="play-btn" id="playBtn">▶</button>
    <button id="undoBtn" title="Undo">↶</button>
    <button id="redoBtn" title="Redo">↷</button>
    <button class="ai-btn" id="aiBtn" title="AI Suggestions">✨</button>
    <button id="exportBtn" title="Export">⇩</button>
  </div>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modalCard"></div></div>
<input type="file" id="audioFileInput" accept="audio/*,.wav,.mp3,.m4a,.aac,.aif,.aiff,.caf" hidden>
<div class="toast" id="toast"></div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const storageKey = 'beat-studio-fixed-v2';

  const makeTrack = name => ({
    id: String(Date.now()) + Math.random(),
    name, volume:.82, pan:0, muted:false, solo:false, armed:false,
    plugins:[], audioKey:null, duration:0, waveform:null
  });

  let state = JSON.parse(localStorage.getItem(storageKey) || 'null') || {
    projects:[{id:'demo', name:'Trap Beat Demo', modified:Date.now(),
      tracks:[makeTrack('808 Bass'), makeTrack('Kick Drum'), makeTrack('Hi-Hats'), makeTrack('Lead Vocal')]}],
    current:'demo', master:'Balanced'
  };

  let undoStack = [], redoStack = [];
  let audioContext = null, masterGain = null;
  let audioBuffers = {};
  let activeSources = {};
  let isPlayingMix = false, mixStartTime = 0, mixElapsed = 0, mixRAF = null;
  let soloPlayingTrackId = null, soloStartTime = 0, soloElapsed = 0, soloRAF = null;
  let mediaRecorder = null, recordChunks = [], recordingTrackId = null, micStream = null;
  let pendingUploadTrackId = null;
  let autoPitchOn = false;

  const PLUGIN_PRESETS = [
    {id:'vocal-chain', name:'Vocal Chain', tag:'Vocal', desc:'EQ + compressor + de-esser + reverb glue.', gain:1.0, params:{eq:2,comp:0.6,reverb:0.18}},
    {id:'808-drive', name:'808 Drive', tag:'Bass', desc:'Saturated low-end with harmonic drive & sub boost.', gain:1.12, params:{drive:0.7,sub:0.5}},
    {id:'dynamics-proc', name:'Dynamics Processor', tag:'Dynamics', desc:'Multiband compression for punch & consistency.', gain:1.0, params:{comp:0.75,ratio:4}},
    {id:'tape-sat', name:'Tape Saturation', tag:'Color', desc:'Warm analog-style tape saturation & wow/flutter.', gain:0.96, params:{warmth:0.55,wobble:0.1}}
  ];

  const MASTER_PRESETS = [
    {id:'Balanced', name:'Balanced', desc:'Neutral, transparent loudness for general playback.', gain:1.0},
    {id:'Loud & Punchy', name:'Loud & Punchy', desc:'Aggressive limiting and punch for club/playlist impact.', gain:1.18},
    {id:'Warm Vintage', name:'Warm Vintage', desc:'Rolled-off highs, boosted low-mids, tape-style glue.', gain:1.05},
    {id:'Bright Streaming', name:'Bright Streaming', desc:'Streaming-loudness target with airy top end.', gain:1.1}
  ];

  const AI_TIPS = [
    {id:'tip-vocal-comp', title:'Tighten the lead vocal', body:'Your lead vocal has wide dynamic range — add a Vocal Chain to even it out and bring it forward.', action:s=>applyPluginToFirstMatching(s,/vocal|lead/i,'vocal-chain')},
    {id:'tip-808-drive', title:'Warm up the 808', body:'The low end sounds thin. Try 808 Drive for more harmonic weight and sub presence.', action:s=>applyPluginToFirstMatching(s,/808|bass|sub/i,'808-drive')},
    {id:'tip-automix', title:'Balance your mix', body:'A few tracks are clipping past each other in level. Run Automix to rebalance volumes automatically.', action:s=>{autoMix(s);}},
    {id:'tip-master-loud', title:'Try Loud & Punchy master', body:'This sounds like a beat meant for playlists — a punchier master style will add impact.', action:s=>{s.master='Loud & Punchy';}},
    {id:'tip-tape', title:'Add analog warmth', body:'Add Tape Saturation across your drums for a cohesive, vintage glue.', action:s=>applyPluginToFirstMatching(s,/kick|drum|hat/i,'tape-sat')},
    {id:'tip-dynamics', title:'Control peaks', body:'Add a Dynamics Processor to your loudest track to keep transients from overwhelming the mix.', action:s=>applyPluginToLoudest(s,'dynamics-proc')}
  ];

  function applyPluginToFirstMatching(session, regex, pluginId){
    const t = session.tracks.find(tr => regex.test(tr.name) && !tr.plugins.includes(pluginId));
    if(t){ t.plugins.push(pluginId); return true; }
    const any = session.tracks.find(tr=>!tr.plugins.includes(pluginId));
    if(any){ any.plugins.push(pluginId); return true; }
    return false;
  }
  function applyPluginToLoudest(session, pluginId){
    const t = [...session.tracks].sort((a,b)=>b.volume-a.volume)[0];
    if(t && !t.plugins.includes(pluginId)){ t.plugins.push(pluginId); return true; }
    return false;
  }

  function currentProject(){ return state.projects.find(p => p.id === state.current); }
  function save(){ localStorage.setItem(storageKey, JSON.stringify(state)); }

  function snapshot(){
    undoStack.push(JSON.stringify(currentProject()));
    if(undoStack.length > 30) undoStack.shift();
    redoStack = [];
  }
  function undo(){
    const proj = currentProject();
    if(!proj || !undoStack.length) return toast('Nothing to undo');
    redoStack.push(JSON.stringify(proj));
    const prev = JSON.parse(undoStack.pop());
    Object.assign(proj, prev);
    save(); renderStudio(); toast('Undid last change');
  }
  function redo(){
    const proj = currentProject();
    if(!proj || !redoStack.length) return toast('Nothing to redo');
    undoStack.push(JSON.stringify(proj));
    const next = JSON.parse(redoStack.pop());
    Object.assign(proj, next);
    save(); renderStudio(); toast('Redid change');
  }

  function toast(msg){
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(el._t); el._t = setTimeout(()=>el.classList.remove('show'), 2200);
  }

  function ensureAudioContext(){
    if(!audioContext){
      audioContext = new (window.AudioContext || window.webkitAudioContext)();
      masterGain = audioContext.createGain();
      masterGain.connect(audioContext.destination);
      applyMasterPreset(state.master);
    }
    return audioContext;
  }

  function applyMasterPreset(id){
    const preset = MASTER_PRESETS.find(p=>p.id===id) || MASTER_PRESETS[0];
    if(masterGain) masterGain.gain.value = preset.gain;
  }

  function showScreen(id){
    document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
    $(id).classList.add('active');
    $('dock').style.display = id === 'screen-studio' ? 'block' : 'none';
  }

  function fmtTime(sec){
    if(!isFinite(sec) || sec < 0) sec = 0;
    const m = Math.floor(sec/60), s = Math.floor(sec%60);
    return String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  }

  function fmtRelative(ts){
    const diff = Date.now() - ts;
    const mins = Math.floor(diff/60000);
    if(mins < 1) return 'Saved just now';
    if(mins < 60) return `Saved ${mins}m ago`;
    const hrs = Math.floor(mins/60);
    if(hrs < 24) return `Saved ${hrs}h ago`;
    return `Saved ${Math.floor(hrs/24)}d ago`;
  }

  function renderHome(){
    const list = $('projectList');
    list.innerHTML = '';
    if(!state.projects.length){
      list.innerHTML = '<div class="empty">No sessions yet. Create one to get started.</div>';
      return;
    }
    state.projects.slice().sort((a,b)=>b.modified-a.modified).forEach(p=>{
      const div = document.createElement('div');
      div.className = 'project';
      div.innerHTML = `
        <button class="delete" data-del="${p.id}">✕</button>
        <div class="project-name">${escapeHtml(p.name)}</div>
        <div class="project-meta">${p.tracks.length} tracks · ${fmtRelative(p.modified)}</div>
        <div class="wave-mini"></div>`;
      div.addEventListener('click', e => {
        if(e.target.closest('[data-del]')) return;
        openProject(p.id);
      });
      list.appendChild(div);
    });
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  function openProject(id){
    state.current = id;
    save();
    showScreen('screen-studio');
    renderStudio();
  }

  function newSession(){
    const id = String(Date.now());
    state.projects.push({id, name:'New Session', modified:Date.now(), tracks:[]});
    save();
    openProject(id);
  }

  function deleteProject(id){
    state.projects = state.projects.filter(p=>p.id!==id);
    if(state.current === id) state.current = state.projects[0]?.id || null;
    save(); renderHome();
    toast('Session deleted');
  }

  let activeTab = 'tracks';

  function renderStudio(){
    const proj = currentProject();
    if(!proj) { showScreen('screen-home'); renderHome(); return; }
    $('studioProjectName').textContent = proj.name;
    $('studioProjectMeta').textContent = fmtRelative(proj.modified);
    renderTracks();
    renderPluginsTab();
    renderMixTab();
    renderMasterTab();
    updateUndoRedoButtons();
  }

  function updateUndoRedoButtons(){
    $('undoBtn').disabled = undoStack.length === 0;
    $('redoBtn').disabled = redoStack.length === 0;
  }

  function renderTracks(){
    const proj = currentProject();
    const list = $('trackList');
    list.innerHTML = '';
    if(!proj.tracks.length){
      list.innerHTML = '<div class="empty">No tracks yet. Add a track to record or upload audio.</div>';
      return;
    }
    proj.tracks.forEach(t=>{
      const div = document.createElement('div');
      div.className = 'track' + (t.armed ? ' armed' : '');
      const hasAudio = !!audioBuffers[t.id] || !!t.audioKey;
      div.innerHTML = `
        <div class="track-top">
          <button class="small-btn ${t.armed?'active':''}" data-arm="${t.id}" title="Arm for recording">${t.armed?'●ARM':'ARM'}</button>
          <input class="track-title" value="${escapeHtml(t.name)}" data-rename="${t.id}">
          <button class="small-btn ${t.muted?'active':''}" data-mute="${t.id}">M</button>
          <button class="small-btn ${t.solo?'solo-active':''}" data-solo="${t.id}">S</button>
          <button class="small-btn" data-remove="${t.id}">✕</button>
        </div>
        <div class="wave-row">
          <button class="play-fab" data-play="${t.id}" ${hasAudio?'':'disabled'}>▶</button>
          <canvas data-canvas="${t.id}" style="padding-left:40px"></canvas>
        </div>
        <div class="plugin-chip-row" data-chips="${t.id}"></div>
      `;
      list.appendChild(div);
      const canvas = div.querySelector(`[data-canvas="${t.id}"]`);
      drawTrackWaveform(canvas, t);

  function computePeaks(buffer, targetPoints){
    const data = buffer.getChannelData(0);
    const blockSize = Math.floor(data.length / targetPoints) || 1;
    const peaks = [];
    for(let i=0;i<targetPoints;i++){
      const start = i*blockSize;
      let max = 0;
      for(let j=0;j<blockSize && start+j<data.length;j++){
        const v = Math.abs(data[start+j]);
        if(v>max) max=v;
      }
      peaks.push(max);
    }
    return peaks;
  }

  function drawTrackWaveform(canvas, track, playheadRatio){
    const dpr = window.devicePixelRatio || 1;
    const rect = canvas.getBoundingClientRect();
    const w = Math.max(rect.width, 260), h = 58;
    canvas.width = w*dpr; canvas.height = h*dpr;
    const ctx = canvas.getContext('2d');
    ctx.scale(dpr,dpr);
    ctx.clearRect(0,0,w,h);
    const buffer = audioBuffers[track.id];
    const mid = h/2;
    if(buffer){
      if(!track.waveform) track.waveform = computePeaks(buffer, 140);
      const peaks = track.waveform;
      const barW = w/peaks.length;
      ctx.fillStyle = '#ff3737';
      peaks.forEach((p, i)=>{
        const barH = Math.max(2, p*h*0.9);
        ctx.fillRect(i*barW, mid-barH/2, Math.max(1,barW-1), barH);
      });
      if(playheadRatio != null){
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(playheadRatio*w-1, 0, 2, h);
      }
    } else {
      ctx.strokeStyle = '#3a3a3a';
      ctx.setLineDash([4,5]);
      ctx.beginPath(); ctx.moveTo(0,mid); ctx.lineTo(w,mid); ctx.stroke();
      ctx.fillStyle = '#666'; ctx.font = '11px sans-serif';
      ctx.fillText('No audio — record or upload', 44, mid+4);
    }
  }

  function bindScrub(canvas){
    const trackId = canvas.dataset.canvas;
    const seek = (clientX) => {
      const buffer = audioBuffers[trackId];
      if(!buffer) return;
      const rect = canvas.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (clientX-rect.left)/rect.width));
      const proj = currentProject();
      const t = proj.tracks.find(x=>x.id===trackId);
      stopSoloPlayback();
      soloElapsed = ratio * buffer.duration;
      drawTrackWaveform(canvas, t, ratio);
    };
    let dragging = false;
    canvas.addEventListener('pointerdown', e => { dragging = true; seek(e.clientX); });
    canvas.addEventListener('pointermove', e => { if(dragging) seek(e.clientX); });
    window.addEventListener('pointerup', () => dragging = false);
  }

  function toggleSoloPlayback(trackId){
    if(soloPlayingTrackId === trackId){ stopSoloPlayback(); return; }
    stopSoloPlayback();
    stopMixPlayback();
    const buffer = audioBuffers[trackId];
    if(!buffer) return;
    ensureAudioContext();
    const source = audioContext.createBufferSource();
    source.buffer = buffer;
    const gainNode = audioContext.createGain();
    source.connect(gainNode); gainNode.connect(masterGain);
    source.start(0, soloElapsed || 0);
    soloStartTime = audioContext.currentTime - (soloElapsed || 0);
    soloPlayingTrackId = trackId;
    activeSources[trackId] = {source, gainNode};
    source.onended = () => { if(soloPlayingTrackId === trackId){ soloElapsed = 0; stopSoloPlayback(); } };
    updatePlayIcons();
    soloRAF = requestAnimationFrame(tickSoloPlayback);
  }

  function tickSoloPlayback(){
    if(!soloPlayingTrackId) return;
    const proj = currentProject();
    const t = proj.tracks.find(x=>x.id===soloPlayingTrackId);
    const buffer = audioBuffers[soloPlayingTrackId];
    const elapsed = audioContext.currentTime - soloStartTime;
    const ratio = buffer ? Math.min(1, elapsed/buffer.duration) : 0;
    const canvas = document.querySelector(`[data-canvas="${soloPlayingTrackId}"]`);
    if(canvas) drawTrackWaveform(canvas, t, ratio);
    soloRAF = requestAnimationFrame(tickSoloPlayback);
  }

  function stopSoloPlayback(){
    if(soloPlayingTrackId && activeSources[soloPlayingTrackId]){
      try{ activeSources[soloPlayingTrackId].source.stop(); }catch(e){}
      delete activeSources[soloPlayingTrackId];
    }
    if(soloRAF) cancelAnimationFrame(soloRAF);
    soloPlayingTrackId = null;
    updatePlayIcons();
  }

  function toggleMixPlayback(){
    if(isPlayingMix){ stopMixPlayback(); return; }
    stopSoloPlayback();
    const proj = currentProject();
    const playable = proj.tracks.filter(t=>audioBuffers[t.id]);
    if(!playable.length) return toast('No audio to play yet');
    ensureAudioContext();
    const soloed = proj.tracks.filter(t=>t.solo).map(t=>t.id);
    playable.forEach(t=>{
      const buffer = audioBuffers[t.id];
      const source = audioContext.createBufferSource();
      source.buffer = buffer;
      const gainNode = audioContext.createGain();
      const panNode = audioContext.createStereoPanner ? audioContext.createStereoPanner() : null;
      const audible = !t.muted && (soloed.length === 0 || soloed.includes(t.id));
      gainNode.gain.value = audible ? t.volume : 0;
      if(panNode){ panNode.pan.value = t.pan; source.connect(gainNode); gainNode.connect(panNode); panNode.connect(masterGain); }
      else { source.connect(gainNode); gainNode.connect(masterGain); }
      source.start(0, mixElapsed || 0);
      activeSources[t.id] = {source, gainNode, panNode};
    });
    mixStartTime = audioContext.currentTime - (mixElapsed || 0);
    isPlayingMix = true;
    updatePlayIcons();
    mixRAF = requestAnimationFrame(tickMixPlayback);
  }

  function tickMixPlayback(){
    if(!isPlayingMix) return;
    const proj = currentProject();
    const maxDur = Math.max(1, ...proj.tracks.map(t=>audioBuffers[t.id]?.duration || 0));
    const elapsed = audioContext.currentTime - mixStartTime;
    $('transportTime').textContent = `${fmtTime(elapsed)} / ${fmtTime(maxDur)}`;
    animateMeters();
    if(elapsed >= maxDur){ mixElapsed = 0; stopMixPlayback(); return; }
    mixRAF = requestAnimationFrame(tickMixPlayback);
  }

  function stopMixPlayback(){

  async function startRecording(){
    const proj = currentProject();
    let track = proj.tracks.find(t=>t.armed);
    if(!track){
      if(!proj.tracks.length) { snapshot(); proj.tracks.push(makeTrack('Recording ' + (proj.tracks.length+1))); }
      track = proj.tracks[proj.tracks.length-1];
      track.armed = true;
    }
    try{
      micStream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(err){
      toast('Microphone permission denied'); return;
    }
    recordingTrackId = track.id;
    recordChunks = [];
    mediaRecorder = new MediaRecorder(micStream);
    mediaRecorder.ondataavailable = e => { if(e.data.size>0) recordChunks.push(e.data); };
    mediaRecorder.onstop = async () => {
      const blob = new Blob(recordChunks, {type: mediaRecorder.mimeType || 'audio/webm'});
      await loadBlobIntoTrack(blob, recordingTrackId);
      micStream.getTracks().forEach(tr=>tr.stop());
      $('recBadge').classList.remove('show');
      $('recBtn').classList.remove('recording');
      toast('Recording added to ' + track.name);
    };
    mediaRecorder.start();
    $('recBadge').classList.add('show');
    $('recBtn').classList.add('recording');
  }

  function stopRecording(){

  function autoMix(session){
    const proj = session || currentProject();
    if(!proj.tracks.length) return;
    proj.tracks.forEach(t=>{
      const buffer = audioBuffers[t.id];
      let target = 0.78;
      if(/vocal|lead/i.test(t.name)) target = 0.88;
      else if(/808|bass|kick|drum/i.test(t.name)) target = 0.72;
      if(buffer){
        const peaks = t.waveform || computePeaks(buffer, 140);
        t.waveform = peaks;
        const avgPeak = peaks.reduce((a,b)=>a+b,0)/peaks.length;
        const correction = avgPeak > 0 ? Math.min(1.3, Math.max(0.6, 0.5/avgPeak)) : 1;
        target = Math.min(0.95, target * correction);
      }
      t.volume = Math.round(target*100)/100;
      t.pan = /hi-hat|hat/i.test(t.name) ? 0.15 : (/808|bass|kick/i.test(t.name) ? 0 : t.pan);
    });
    proj.modified = Date.now();
  }

  async function renderMixToBuffer(){
    const proj = currentProject();
    const playable = proj.tracks.filter(t=>audioBuffers[t.id]);
    const maxDur = Math.max(1, ...playable.map(t=>audioBuffers[t.id].duration));
    const sampleRate = 44100;
    const offlineCtx = new OfflineAudioContext(2, Math.ceil(maxDur*sampleRate), sampleRate);
    const masterPreset = MASTER_PRESETS.find(p=>p.id===state.master) || MASTER_PRESETS[0];
    const masterOut = offlineCtx.createGain();
    masterOut.gain.value = masterPreset.gain;
    masterOut.connect(offlineCtx.destination);
    const soloed = proj.tracks.filter(t=>t.solo).map(t=>t.id);
    playable.forEach(t=>{
      const source = offlineCtx.createBufferSource();
      source.buffer = audioBuffers[t.id];
      const gainNode = offlineCtx.createGain();
      const audible = !t.muted && (soloed.length===0 || soloed.includes(t.id));
      gainNode.gain.value = audible ? t.volume : 0;
      if(offlineCtx.createStereoPanner){
        const panNode = offlineCtx.createStereoPanner();
        panNode.pan.value = t.pan;
        source.connect(gainNode); gainNode.connect(panNode); panNode.connect(masterOut);
      } else {
        source.connect(gainNode); gainNode.connect(masterOut);
      }
      source.start(0);
    });
    return await offlineCtx.startRendering();
  }

  function bufferToWav(buffer){
    const numCh = buffer.numberOfChannels, len = buffer.length;
    const sampleRate = buffer.sampleRate;
    const bytesPerSample = 2;
    const blockAlign = numCh * bytesPerSample;
    const dataSize = len * blockAlign;
    const bufferArr = new ArrayBuffer(44 + dataSize);
    const view = new DataView(bufferArr);
    const writeStr = (offset, str) => { for(let i=0;i<str.length;i++) view.setUint8(offset+i, str.charCodeAt(i)); };
    writeStr(0,'RIFF'); view.setUint32(4, 36+dataSize, true); writeStr(8,'WAVE');
    writeStr(12,'fmt '); view.setUint32(16,16,true); view.setUint16(20,1,true);
    view.setUint16(22,numCh,true); view.setUint32(24,sampleRate,true);
    view.setUint32(28,sampleRate*blockAlign,true); view.setUint16(32,blockAlign,true); view.setUint16(34,16,true);
    writeStr(36,'data'); view.setUint32(40,dataSize,true);
    const channels = []; for(let c=0;c<numCh;c++) channels.push(buffer.getChannelData(c));
    let offset = 44;
    for(let i=0;i<len;i++){
      for(let c=0;c<numCh;c++){
        let sample = Math.max(-1, Math.min(1, channels[c][i]));
        sample = sample < 0 ? sample*0x8000 : sample*0x7fff;
        view.setInt16(offset, sample, true); offset += 2;
      }
    }
    return new Blob([view], {type:'audio/wav'});
  }

  async function renderAndExport(format){
    closeModal();
    toast('Rendering mix…');
    try{
      const rendered = await renderMixToBuffer();
      const wavBlob = bufferToWav(rendered);
      const proj = currentProject();
      const baseName = proj.name.replace(/[^a-z0-9\-_ ]/gi,'').trim() || 'beat-studio-mix';
      let finalBlob = wavBlob, ext = 'wav', mime = 'audio/wav';
      if(format === 'm4a'){
        const encoded = await encodeCompressed(rendered);
        finalBlob = encoded.blob; ext = encoded.ext; mime = encoded.mime;
      }
      await shareOrDownload(finalBlob, `${baseName}.${ext}`, mime);
    }catch(err){
      toast('Export failed: ' + err.message);
    }
  }

  function encodeCompressed(buffer){
    return new Promise((resolve,reject)=>{
      try{
        const ctx = new (window.AudioContext||window.webkitAudioContext)();
        const dest = ctx.createMediaStreamDestination();
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(dest);
        const mimeCandidates = ['audio/mp4','audio/aac','audio/webm;codecs=opus','audio/webm'];
        const supported = mimeCandidates.find(m=>MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(m)) || '';
        const recorder = new MediaRecorder(dest.stream, supported ? {mimeType:supported} : undefined);
        const chunks = [];
        recorder.ondataavailable = e => { if(e.data.size) chunks.push(e.data); };
        recorder.onstop = () => {
          ctx.close();
          const mime = supported || 'audio/webm';
          const ext = mime.includes('mp4') ? 'm4a' : (mime.includes('aac') ? 'm4a' : 'webm');
          resolve({blob: new Blob(chunks, {type:mime}), ext, mime});
        };
        recorder.start();
        source.start();
        source.onended = () => setTimeout(()=>recorder.stop(), 150);
      }catch(err){ reject(err); }
    });
  }

  async function shareOrDownload(blob, filename, mime){
    const file = new File([blob], filename, {type: mime});
    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title: filename});
        toast('Shared ' + filename);
        return;
      }catch(e){ }
    }
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 400);
    toast('Saved ' + filename);
  }

  function openModal(html){
    $('modalCard').innerHTML = html;
    $('modal').classList.add('show');
    $('modalCard').querySelectorAll('[data-close]').forEach(b=>b.onclick = closeModal);
  }
  function closeModal(){ $('modal').classList.remove('show'); }
  $('modal').addEventListener('click', e => { if(e.target.id === 'modal') closeModal(); });

  function openRenameModal(){
    const proj = currentProject();
    openModal(`
      <div class="handle"></div>
      <h2>Rename session</h2>
      <input class="field" id="renameInput" value="${escapeHtml(proj.name)}">
      <div class="modal-actions">
        <button data-close>Cancel</button>
        <button class="confirm" id="renameConfirm">Save</button>
      </div>
    `);
    $('renameConfirm').onclick = () => {
      const val = $('renameInput').value.trim();
      if(val){ snapshot(); proj.name = val; proj.modified = Date.now(); save(); renderStudio(); }
      closeModal();
    };
  }

  document.querySelectorAll('.tab').forEach(tab => tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    document.querySelectorAll('.tab-page').forEach(p=>p.classList.remove('active'));
    tab.classList.add('active');
    activeTab = tab.dataset.tab;
    $('tab-' + activeTab).classList.add('active');
  }));

  $('newSessionBtn').onclick = newSession;
  $('projectList').addEventListener('click', e => {
    const del = e.target.closest('[data-del]');
    if(del) deleteProject(del.dataset.del);
  });
  $('backBtn').onclick = () => { stopMixPlayback(); stopSoloPlayback(); showScreen('screen-home'); renderHome(); };
  $('renameBtn').onclick = openRenameModal;
  $('addTrackBtn').onclick = () => {
    const proj = currentProject();
    snapshot();
    proj.tracks.push(makeTrack('Track ' + (proj.tracks.length+1)));
    proj.modified = Date.now(); save(); renderTracks(); renderPluginsTab(); renderMixTab();
  };
  $('uploadTrackBtn').onclick = () => requestUpload(null);
  $('openPluginPickerBtn').onclick = openPluginPicker;
  $('automixBtn').onclick = runAutomix;
  $('micBtn').onclick = () => {
    const proj = currentProject();
    if(!proj.tracks.some(t=>t.armed) && proj.tracks.length){
      proj.tracks[0].armed = true; renderTracks();
    }
    toast('Arm a track, then hit REC to record from mic');
  };
  $('fxBtn').onclick = openPluginPicker;
  $('autoPitchBtn').onclick = () => {
    autoPitchOn = !autoPitchOn;
    $('autoPitchBtn').style.background = autoPitchOn ? '#42dc99' : '';
    $('autoPitchBtn').style.color = autoPitchOn ? '#052' : '';
    toast('AutoPitch ' + (autoPitchOn ? 'enabled' : 'disabled'));
  };
  $('recBtn').onclick = toggleRecording;
  $('playBtn').onclick = toggleMixPlayback;
  $('undoBtn').onclick = undo;
  $('redoBtn').onclick = redo;
  $('aiBtn').onclick = openAiSuggestions;
  $('exportBtn').onclick = openExportModal;
  $('homeSettingsBtn').onclick = () => toast('Beat Studio v2');

  if(!state.current && state.projects.length) state.current = state.projects[0].id;
  showScreen('screen-home');
  renderHome();
})();
</script>
