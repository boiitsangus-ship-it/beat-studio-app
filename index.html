<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#050505">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Beat Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23050505'/%3E%3Cg stroke='%23ff3737' stroke-width='6' stroke-linecap='round' fill='none'%3E%3Cpath d='M12 50 h8 v0 M24 50 v-14 M24 50 v14 M36 50 v-24 M36 50 v24 M48 50 v-34 M48 50 v34 M60 50 v-20 M60 50 v20 M72 50 v-30 M72 50 v30 M84 50 v-10 M84 50 v10'/%3E%3C/g%3E%3C/svg%3E">
<style>
:root{
  --bg:#050505;--bg2:#0c0c0c;--card:#161616;--card2:#1c1c1c;--line:#2b2b2b;
  --text:#f8f8f8;--muted:#9a9a9a;--red:#ff3737;--red-dark:#3d0f0f;--red-glow:#ff373733;
  --green:#42dc99;--gold:#e6c229
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(circle at 50% -10%,#1a0808 0%,var(--bg) 45%);color:var(--text);
  font:15px -apple-system,BlinkMacSystemFont,"SF Pro Display",Segoe UI,Roboto,sans-serif;min-height:100dvh}
.app{max-width:720px;min-height:100dvh;margin:auto;padding:env(safe-area-inset-top) 14px calc(112px + env(safe-area-inset-bottom))}
button,input,select{font:inherit}
button{border:0;color:inherit;background:none;cursor:pointer;touch-action:manipulation}
button:active{transform:scale(.96)}
button:disabled{opacity:.35;pointer-events:none}
.header{display:flex;align-items:center;justify-content:space-between;padding:16px 2px 8px}
.brand{font-size:22px;font-weight:900;letter-spacing:-.02em}
.brand span{color:var(--red)}
.subtitle{display:block;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-size:12px;font-weight:600}
.icon-btn{width:40px;height:40px;border-radius:50%;background:var(--card2);font-size:17px;display:flex;align-items:center;justify-content:center}
.icon-btn.ghost{background:transparent;border:1px solid var(--line)}
.screen{display:none}
.screen.active{display:block}
h1{margin:20px 0 4px;font-size:32px;font-weight:900;letter-spacing:-.02em}
.lead{margin:0 0 20px;color:var(--muted);font-size:14px}
.primary{width:100%;padding:17px;border-radius:50px;background:var(--red);font-size:15px;font-weight:800;
  box-shadow:0 8px 24px var(--red-glow)}
.project-list{display:grid;gap:10px;margin-top:20px}
.project{position:relative;display:flex;align-items:center;gap:13px;padding:13px;border-radius:16px;background:var(--card);
  border:1px solid var(--line)}
.project-art{width:54px;height:54px;border-radius:11px;background:linear-gradient(145deg,var(--red-dark),#000);
  flex-shrink:0;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
.project-art .bars{display:flex;gap:2px;align-items:center;height:22px}
.project-art .bars i{width:3px;background:var(--red);border-radius:2px;display:block}
.project-info{flex:1;min-width:0}
.project-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.project-meta{margin-top:3px;color:var(--muted);font-size:12px}
.delete{width:30px;height:30px;border-radius:50%;background:var(--card2);color:#999;flex-shrink:0}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:6px 0 16px;-ms-overflow-style:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{min-width:72px;flex:1;padding:11px 8px;border-radius:50px;background:var(--card2);color:#999;font-size:12.5px;font-weight:800}
.tab.active{background:var(--red);color:#fff;box-shadow:0 4px 14px var(--red-glow)}
.tab-page{display:none}
.tab-page.active{display:block;animation:fadein .18s ease}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.track{margin-bottom:12px;padding:14px;border-radius:18px;background:linear-gradient(165deg,var(--card2),var(--card));
  border:1px solid var(--line);position:relative;overflow:hidden}
.track.armed{border-color:#ff9d33;box-shadow:0 0 0 1px #ff9d3355,0 0 20px #ff9d3322}
.track-top{display:flex;gap:7px;align-items:center}
.track-title{flex:1;min-width:0;border:0;background:transparent;color:#fff;font-weight:800;font-size:14px}
.small-btn{min-width:30px;height:28px;padding:0 8px;border-radius:9px;background:#252525;font-size:11px;font-weight:800;color:#ccc}
.small-btn.active{background:var(--red);color:#fff}
.small-btn.solo-active{background:var(--gold);color:#111}
.wave-scroll{position:relative;margin:12px 0 8px;border-radius:12px;overflow:hidden;background:#030303}
canvas{display:block;height:64px;touch-action:none}
.play-fab{position:absolute;left:6px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:50%;
  background:#000c;border:1px solid #ff373766;color:var(--red);font-size:12px;display:flex;align-items:center;
  justify-content:center;z-index:3;backdrop-filter:blur(4px)}
.zoom-hint{position:absolute;right:6px;bottom:6px;padding:3px 8px;border-radius:20px;background:#0009;color:#999;
  font-size:9px;font-weight:700;z-index:3;pointer-events:none}
.control-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;color:var(--muted);font-size:11px}
.control-row label{display:grid;gap:4px;font-weight:700}
input[type=range]{width:100%;accent-color:var(--red);height:4px}
.plugin-chip-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.plugin-chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:20px;background:#241111;
  border:1px solid #5b1e1e;font-size:11px;font-weight:800;color:#ffb3b3}
.plugin-chip button{color:#ff9d9d;font-size:13px;line-height:1}
.empty{padding:40px 16px;border-radius:18px;text-align:center;color:var(--muted);background:var(--card);border:1px dashed #333}
.secondary{padding:14px;border-radius:14px;background:var(--card2);font-weight:800;font-size:13px}
.panel{margin-bottom:12px;padding:16px;border-radius:18px;background:linear-gradient(165deg,var(--card2),var(--card));
  border:1px solid var(--line)}
.panel h3{margin:0 0 8px;font-size:15px;font-weight:800}
.panel p{margin:0 0 12px;color:var(--muted);font-size:12.5px}
.field{width:100%;margin-bottom:10px;padding:13px;border:1px solid #3a3a3a;border-radius:12px;background:#0a0a0a;color:#fff}
textarea.field{resize:none;min-height:78px}
.plugin-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;border-bottom:1px solid #232323}
.plugin-row:last-child{border-bottom:0}
.plugin-tag{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:20px;background:#241111;color:#ff9d9d;
  font-size:9.5px;font-weight:800;letter-spacing:.03em;text-transform:uppercase}
.preset-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:8px}
.preset{padding:14px 12px;border:1px solid var(--line);border-radius:15px;background:var(--card2);text-align:left}
.preset.selected{border-color:var(--red);background:linear-gradient(165deg,#391515,#1c0a0a)}
.preset b{display:block;font-size:13px;margin-bottom:3px}
.preset small{display:block;color:var(--muted);font-size:10.5px;line-height:1.35}
.meter{display:flex;align-items:end;gap:8px;height:110px;margin:16px 0}
.meter-bar{width:50%;height:16%;border-radius:6px 6px 2px 2px;background:linear-gradient(var(--green),var(--gold),var(--red));
  transition:height .12s}
.dock{position:fixed;z-index:10;right:0;bottom:0;left:0;max-width:720px;margin:auto;
  padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);
  background:linear-gradient(180deg,#0d0d0df0,#000f);backdrop-filter:blur(18px)}
.time{text-align:center;margin-bottom:9px;font-variant-numeric:tabular-nums;font-weight:800;font-size:12.5px;color:#ccc}
.transport{display:grid;grid-template-columns:36px 36px 36px 1fr 46px 36px 36px 36px 36px;gap:6px}
.transport button{height:44px;border-radius:14px;background:#1c1c1c;font-weight:800;font-size:14px;color:#ddd}
.transport .rec-btn{background:#3d0f0f;color:#ff9999}
.transport .rec-btn.recording{background:var(--red);color:#fff;animation:pulse 1s infinite}
.transport .play-btn{background:var(--red);font-size:18px;box-shadow:0 4px 16px var(--red-glow)}
.transport .ai-btn{background:linear-gradient(135deg,#3a1c5c,#7d2fbf);color:#fff}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.modal{position:fixed;z-index:30;inset:0;display:none;align-items:flex-end;background:#000c}
.modal.show{display:flex}
.modal-card{width:100%;max-width:720px;margin:auto;max-height:85vh;overflow-y:auto;
  padding:14px 16px calc(22px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;background:#131313;
  border-top:1px solid #2a2a2a}
.handle{width:36px;height:4px;margin:0 auto 16px;border-radius:5px;background:#555}
.modal h2{margin:0 0 4px;font-size:20px;font-weight:900}
.modal .sub{margin:0 0 14px;color:var(--muted);font-size:12.5px}
.option{width:100%;margin:6px 0;padding:15px;border-radius:14px;background:#1e1e1e;text-align:left;font-weight:800}
.option small{display:block;margin-top:3px;color:#999;font-weight:500}
.modal-actions{display:flex;gap:8px;margin-top:14px}
.modal-actions button{flex:1;padding:14px;border-radius:14px;background:#2a2a2a;font-weight:800}
.modal-actions .confirm{background:var(--red)}
.toast{position:fixed;z-index:50;bottom:120px;left:50%;padding:11px 15px;border-radius:12px;background:#f5f5f5;color:#111;
  transform:translate(-50%,80px);opacity:0;transition:.22s;white-space:nowrap;font-size:13px;font-weight:800;
  max-width:88vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0);opacity:1}
.rec-badge{display:none;position:fixed;z-index:20;top:78px;right:16px;padding:5px 8px;border-radius:8px;background:#d92929;
  font-size:10px;font-weight:900}
.rec-badge.show{display:block}
.ai-card{padding:14px;margin-bottom:10px;border-radius:15px;background:linear-gradient(165deg,#241a33,#160f21);
  border:1px solid #4c2f77}
.ai-card h4{margin:0 0 4px;font-size:13.5px;color:#d8b8ff;font-weight:800}
.ai-card p{margin:0 0 11px;font-size:12px;color:#bbb;line-height:1.4}
.ai-actions{display:flex;gap:8px}
.ai-actions
