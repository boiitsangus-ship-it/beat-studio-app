<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>LilyASI · Jarvis Mobile Host</title>
<style>
body{margin:0;background:#050505;color:#fff;font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.app{max-width:760px;margin:auto;padding:12px}.bar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:10px}.pill{padding:6px 9px;border:1px solid #2a2a2a;border-radius:999px;background:#111;font-size:11px}.ok{color:#71e6a9}.warn{color:#ffd36b}.card{border:1px solid #272727;border-radius:18px;background:#101010;padding:12px;margin-bottom:10px}iframe{width:100%;height:64dvh;border:1px solid #272727;border-radius:18px;background:#000}.row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #202020}.row:last-child{border-bottom:0}button,textarea{font:inherit}button{width:100%;padding:12px;border:0;border-radius:12px;background:#222;color:#fff;font-weight:800}textarea{width:100%;min-height:88px;box-sizing:border-box;background:#090909;color:#fff;border:1px solid #252525;border-radius:12px;padding:11px;resize:vertical}.meta{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.meta small{color:#888;display:block;margin-top:3px;line-height:1.35}.answer{white-space:pre-wrap;margin-top:9px;padding:10px;border-radius:12px;background:#090909;border:1px solid #222;color:#ddd;min-height:42px}.stack{display:grid;gap:8px}.two{display:grid;grid-template-columns:1fr 1fr;gap:7px}
</style>
<script src="runtime-contract.js"></script>
<script src="continuity-state.js"></script>
<script src="meta-muse-provider.js"></script>
</head>
<body><main class="app">
<div class="bar"><div><b>LilyASI</b><div style="color:#888;font-size:11px">Jarvis 7 mobile compatibility host</div></div><span class="pill" id="overall">TESTING</span></div>
<section class="card"><div class="meta"><div><b>Meta Muse Glimmer 30B</b><small>Hardwired LilyASI local agent · coding · reasoning · vision</small></div><span class="pill" id="modelState">CHECKING</span></div></section>
<section class="card stack"><textarea id="agentPrompt" maxlength="12000" placeholder="Ask LilyASI to code, reason, inspect a task, or plan the next step..."></textarea><div class="two"><button id="runAgent" type="button">Run local agent</button><button id="checkAgent" type="button">Check model</button></div><div class="answer" id="agentAnswer">Local agent is configured for meta-models/Muse-Glimmer-30B at 127.0.0.1:8000. A successful model check requires that exact model ID.</div></section>
<section class="card" id="checks"></section>
<iframe id="jarvisFrame" src="jarvis-mobile.html" title="Jarvis 7 mobile runtime"></iframe>
<section class="card"><button id="rerun" type="button">Run compatibility test again</button></section>
</main>
<script>
'use strict';
const checksEl=document.getElementById('checks');const overall=document.getElementById('overall');const frame=document.getElementById('jarvisFrame');const modelState=document.getElementById('modelState');const agentAnswer=document.getElementById('agentAnswer');const agentPrompt=document.getElementById('agentPrompt');const state={};
function setCheck(name,ok,detail){state[name]={ok:Boolean(ok),detail:String(detail??'')};render()}
function render(){
  const entries=Object.entries(state);checksEl.replaceChildren();
  for(const [name,v] of entries){const row=document.createElement('div');row.className='row';const left=document.createElement('span');left.textContent=name;const right=document.createElement('span');right.className=v.ok?'ok':'warn';right.textContent=`${v.ok?'PASS':'FAIL'} · ${v.detail}`;row.append(left,right);checksEl.append(row)}
  const all=entries.length>=7&&entries.every(([,v])=>v&&v.ok===true);overall.textContent=all?'COMPATIBLE':'CHECKING / BLOCKED';overall.className='pill '+(all?'ok':'warn')
}
async function checkModel(){modelState.textContent='CHECKING';modelState.className='pill';try{const result=await MetaMuseProvider.health();modelState.textContent=result.ok?'LOCAL READY':'LOCAL OFFLINE';modelState.className='pill '+(result.ok?'ok':'warn');const detail=result.ok?MetaMuseProvider.MODEL_ID:(result.discoveredModels?.length?`expected ${MetaMuseProvider.MODEL_ID}; found ${result.discoveredModels.join(', ')}`:'exact model unavailable');setCheck('Muse Glimmer provider',result.ok,detail);return result}catch(error){modelState.textContent='LOCAL OFFLINE';modelState.className='pill warn';setCheck('Muse Glimmer provider',false,error?.message||'health check failed');return{ok:false,error:error?.message}}}
async function runAgent(){const prompt=agentPrompt.value.trim();if(!prompt){agentAnswer.textContent='Enter a task first.';return}agentAnswer.textContent='Running Muse Glimmer locally…';try{const result=await MetaMuseProvider.run(prompt);agentAnswer.textContent=result.content}catch(error){agentAnswer.textContent='Local Muse Glimmer is unavailable. Start the authorized model runtime at 127.0.0.1:8000 or configure a secure server-side provider.\n\n'+(error?.message||'Unknown error')}}
function runCore(){setCheck('Runtime contract',!!window.LilyJarvisContract&&LilyJarvisContract.CONTRACT_VERSION===1,'v1');const hello=LilyJarvisContract.makeHello();setCheck('Identity routing',hello.source==='lilyasi'&&hello.target==='jarvis7-mobile','Lily → Jarvis');setCheck('Default agent',hello.defaultAgent&&hello.defaultAgent.model===MetaMuseProvider.MODEL_ID,'Muse Glimmer 30B');const backup=JarvisContinuity.createBackup({mode:'chat',queue:[{module:'jarvis',label:'compatibility test',time:Date.now(),mode:'chat'}],lessons:['verified test lesson']});const valid=JarvisContinuity.validateBackup(backup);setCheck('Continuity round-trip',valid.ok&&JarvisContinuity.restoreBackup(backup).ok,'schema v1');const poisoned={...backup,token:'should-not-import'};setCheck('Unwanted-state rejection',!JarvisContinuity.validateBackup(poisoned).ok,'unknown field bounced');setCheck('Capability boundary',LilyJarvisContract.ALLOWED_CAPABILITIES.every(x=>!/(money|credential|device\.control|secret)/i.test(x)),'least privilege')}
function runFrame(){try{const doc=frame.contentDocument;const title=doc&&doc.title||'';setCheck('Jarvis mobile embed',/Jarvis 7/i.test(title),title||'frame unavailable')}catch(e){setCheck('Jarvis mobile embed',false,e?.name||'frame error')}}
function run(){for(const k of Object.keys(state))delete state[k];runCore();if(frame.contentDocument&&frame.contentDocument.readyState==='complete')runFrame();else setCheck('Jarvis mobile embed',false,'loading');void checkModel()}
frame.addEventListener('load',runFrame);document.getElementById('rerun').addEventListener('click',run);document.getElementById('checkAgent').addEventListener('click',()=>void checkModel());document.getElementById('runAgent').addEventListener('click',()=>void runAgent());run();
</script>
</body></html>
