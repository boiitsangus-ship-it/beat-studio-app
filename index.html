<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<title>Beat Studio</title>
<style>
:root { --bg: #000; --card: #1a1a1a; --border: #2a2a2a; --red: #ff3333; --red2: #cc0000; --text: #fff; --text2: #aaa; --text3: #666; }
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); overflow: hidden; height: 100dvh; width: 100vw; position: relative; }
#splash { position: fixed; inset: 0; background: #000; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .8s; }
.splash-wave { width: 120px; height: 60px; margin-bottom: 24px; }
.splash-wave path { stroke: #ff3333; stroke-width: 3; fill: none; stroke-linecap: round; animation: wave 2s ease-in-out infinite; }
@keyframes wave { 0%,100% { d: path('M10 30 Q30 5 50 30 T90 30'); } 50% { d: path('M10 30 Q30 55 50 30 T90 30'); } }
.splash-title { font-size: 28px; font-weight: 700; letter-spacing: 2px; }
.splash-sub { font-size: 13px; color: var(--text2); margin-top: 8px; }
.screen { position: fixed; inset: 0; display: none; flex-direction: column; background: var(--bg); }
.screen.active { display: flex; }
.top-bar { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.8); backdrop-filter: blur(10px); z-index: 10; }
.top-bar h1 { font-size: 18px; font-weight: 600; letter-spacing: .5px; }
.btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 14px; border-radius: 10px; font-size: 13px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; touch-action: manipulation; }
.btn:active { transform: scale(.96); }
.btn-red { background: var(--red); border-color: var(--red2); color: #fff; }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 50%; }
.content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
.session-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; cursor: pointer; transition: transform .15s; }
.session-card:active { transform: scale(.96); }
.session-thumb { height: 100px; background: #0a0a0a; position: relative; display: flex; align-items: center; justify-content: center; }
.session-thumb canvas { width: 100%; height: 100%; }
.session-info { padding: 10px 12px; }
.session-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.session-meta { font-size: 11px; color: var(--text2); display: flex; gap: 8px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text2); }
.modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 100; display: none; align-items: flex-end; backdrop-filter: blur(4px); }
.modal-overlay.active { display: flex; }
.modal-sheet { background: var(--card); border-top: 1px solid var(--border); border-radius: 20px 20px 0 0; padding: 20px; width: 100%; max-height: 80vh; overflow-y: auto; animation: slideUp .3s ease; }
@keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
.modal-title { font-size: 18px; font-weight: 600; margin-bottom: 16px; }
.modal-input { width: 100%; background: #0a0a0a; border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; color: var(--text); font-size: 16px; margin-bottom: 16px; outline: none; }
.modal-input:focus { border-color: var(--red); }
.modal-actions { display: flex; gap: 10px; }
.modal-actions .btn { flex: 1; justify-content: center; padding: 12px; }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(120px); background: #2a2a2a; border: 1px solid var(--border); color: var(--text); padding: 10px 20px; border-radius: 12px; font-size: 13px; z-index: 200; transition: transform .3s ease; white-space: nowrap; }
.toast.show { transform: translateX(-50%) translateY(0); }
.tab-bar { display: flex; border-bottom: 1px solid var(--border); background: rgba(0,0,0,.8); }
.tab-btn { flex: 1; padding: 12px 8px; font-size: 12px; font-weight: 500; color: var(--text2); background: none; border: none; cursor: pointer; position: relative; text-align: center; }
.tab-btn.active { color: var(--red); }
.tab-btn.active::after { content: ''; position: absolute; bottom: 0; left: 20%; right: 20%; height: 2px; background: var(--red); border-radius: 1px; }
.transport-dock { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(10,10,10,.95); border-top: 1px solid var(--border); padding: 8px 12px; display: flex; align-items: center; justify-content: space-between; z-index: 50; backdrop-filter: blur(10px); }
.time-display { font-family: 'SF Mono', monospace; font-size: 18px; font-weight: 600; letter-spacing: 1px; min-width: 90px; text-align: center; }
.transport-btns { display: flex; gap: 8px; align-items: center; }
.transport-btns .btn-icon { width: 42px; height: 42px; }
.play-btn.playing { background: var(--red); border-color: var(--red2); }
.rec-btn.recording { animation: recPulse 1s infinite; background: var(--red); border-color: var(--red2); color: #fff; }
@keyframes recPulse { 0%,100% { opacity: 1; } 50% { opacity: .6; } }
.rec-badge { position: absolute; top: -6px; right: -6px; background: var(--red); color: #fff; font-size: 9px; font-weight: 700; padding: 2px 5px; border-radius: 4px; animation: recPulse 1s infinite; display: none; }
.rec-badge.show { display: block; }
.track-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 12px; overflow: hidden; }
.track-header { display: flex; align-items: center; gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border); }
.track-color { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
.track-name { flex: 1; font-size: 14px; font-weight: 600; background: none; border: none; color: var(--text); outline: none; min-width: 0; }
.track-controls { display: flex; gap: 6px; }
.track-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: #0a0a0a; color: var(--text2); font-size: 11px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.track-btn.active { color: var(--red); border-color: var(--red); }
.track-btn.solo-active { color: #3b82f6; border-color: #3b82f6; }
.track-wave { height: 80px; background: #0a0a0a; position: relative; cursor: pointer; touch-action: none; }
.track-wave canvas { width: 100%; height: 100%; }
.track-wave .playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--red); pointer-events: none; }
.track-params { display: flex; gap: 12px; padding: 10px 12px; align-items: center; }
.param-slider { flex: 1; display: flex; flex-direction: column; gap: 4px; }
.param-slider label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: .5px; }
.param-slider input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; background: var(--border); border-radius: 2px; outline: none; }
.param-slider input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; background: var(--red); border-radius: 50%; border: 2px solid #000; cursor: pointer; }
.plugin-chain { display: flex; gap: 8px; padding: 10px 12px; overflow-x: auto; }
.plugin-slot { min-width: 80px; height: 60px; background: #0a0a0a; border: 1px dashed var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--text3); cursor: pointer; flex-shrink: 0; }
.plugin-slot.filled { border-style: solid; border-color: var(--border); background: var(--card); color: var(--text); flex-direction: column; gap: 2px; }
.plugin-slot .plugin-name { font-size: 10px; font-weight: 600; }
.plugin-slot .plugin-param { font-size: 9px; color: var(--text2); }
.plugin-panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; }
.plugin-panel h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
.plugin-knob-row { display: flex; gap: 16px; margin-bottom: 12px; }
.plugin-knob { flex: 1; text-align: center; }
.plugin-knob input[type=range] { width: 100%; height: 4px; -webkit-appearance: none; background: var(--border); border-radius: 2px; margin: 8px 0; }
.plugin-knob input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; background: var(--red); border-radius: 50%; border: 2px solid #000; cursor: pointer; }
.plugin-knob label { font-size: 10px; color: var(--text2); display: block; }
.mix-fader { display: flex; align-items: center; gap: 12px; padding: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; margin-bottom: 10px; }
.mix-fader .track-color { width: 4px; height: 40px; border-radius: 2px; }
.mix-fader .fader-name { flex: 1; font-size: 14px; font-weight: 500; }
.fader-vol { flex: 2; } .fader-pan { flex: 1; }
.master-presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 16px; }
.preset-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; text-align: center; cursor: pointer; transition: all .15s; }
.preset-card:active { transform: scale(.96); }
.preset-card.active { border-color: var(--red); background: rgba(255,51,51,.1); }
.preset-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
.preset-card p { font-size: 11px; color: var(--text2); }
.meter-container { display: flex; gap: 8px; align-items: flex-end; height: 120px; background: #0a0a0a; border-radius: 12px; padding: 12px; }
.meter-bar { flex: 1; background: var(--border); border-radius: 4px; position: relative; overflow: hidden; height: 100%; }
.meter-fill { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, #0f0, #ff0, var(--red)); transition: height .05s linear; border-radius: 4px; }
.meter-label { text-align: center; font-size: 10px; color: var(--text2); margin-top: 4px; }
.ai-panel { position: fixed; bottom: 70px; left: 12px; right: 12px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; z-index: 40; transform: translateY(150%); transition: transform .3s ease; }
.ai-panel.show { transform: translateY(0); }
.ai-panel h4 { font-size: 14px; font-weight: 600; margin-bottom: 8px; display: flex; align-items: center; gap: 6px; }
.ai-panel p { font-size: 13px; color: var(--text2); margin-bottom: 12px; line-height: 1.5; }
.ai-actions { display: flex; gap: 10px; }
.export-option { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
.export-option:active { transform: scale(.98); }
.export-option h4 { font-size: 15px; font-weight: 600; }
.export-option p { font-size: 12px; color: var(--text2); }
.progress-ring { width: 48px; height: 48px; position: relative; flex-shrink: 0; }
.progress-ring svg { transform: rotate(-90deg); }
.progress-ring circle { fill: none; stroke-width: 4; }
.progress-ring .bg { stroke: var(--border); }
.progress-ring .fg { stroke: var(--red); stroke-dasharray: 126; stroke-dashoffset: 126; transition: stroke-dashoffset .3s; }
.progress-text { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 600; }
.action-sheet .action-btn { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 8px; font-size: 15px; color: var(--text); cursor: pointer; text-align: left; display: flex; align-items: center; gap: 10px; }
.action-sheet .action-btn:active { background: #2a2a2a; }
.action-sheet .cancel-btn { background: #2a2a2a; border-color: #3a3a3a; margin-top: 8px; justify-content: center; font-weight: 600; }
.hidden { display: none !important; }
.track-mini-play { width: 28px; height: 28px; border-radius: 50%; border: 1px solid var(--border); background: #0a0a0a; color: var(--text); display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 10px; }
.track-mini-play.playing { background: var(--red); border-color: var(--red2); }
</style>
</head>
<body>

<div id="splash">
<svg class="splash-wave" viewBox="0 0 100 60"><path d="M10 30 Q30 5 50 30 T90 30"/></svg>
<div class="splash-title">BEAT STUDIO</div>
<div class="splash-sub">Mobile Music Production</div>
</div>

<div id="homeScreen" class="screen active">
<div class="top-bar"><h1>Projects</h1><button class="btn btn-red" id="newProjectBtn">+ New</button></div>
<div class="content" id="projectGrid"></div>
</div>

<div id="studioScreen" class="screen">
<div class="top-bar">
<button class="btn btn-sm" id="backBtn">&larr; Projects</button>
<h1 id="studioTitle">Untitled</h1>
<button class="btn btn-sm" id="exportBtn">Export</button>
</div>
<div class="tab-bar">
<button class="tab-btn active" data-tab="tracks">Tracks</button>
<button class="tab-btn" data-tab="plugins">Plugins</button>
<button class="tab-btn" data-tab="mix">Mix</button>
<button class="tab-btn" data-tab="master">Master</button>
</div>
<div class="content" id="tabContent"></div>
<div class="transport-dock">
<div class="time-display" id="timeDisplay">00:00:00</div>
<div class="transport-btns">
<button class="btn btn-icon" id="undoBtn" title="Undo">&#8617;</button>
<button class="btn btn-icon rec-btn" id="recBtn" title="Record">
<div style="position:relative">
<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
<span class="rec-badge" id="recBadge">REC</span>
</div>
</button>
<button class="btn btn-icon play-btn" id="playBtn" title="Play/Pause">
<svg id="playIcon" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
<svg id="pauseIcon" class="hidden" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
</button>
<button class="btn btn-icon" id="redoBtn" title="Redo">&#8618;</button>
</div>
<div class="transport-btns">
<button class="btn btn-icon" id="micBtn" title="Mic">&#127908;</button>
<button class="btn btn-icon" id="addTrackBtn" title="Add Track">+</button>
<button class="btn btn-icon" id="aiBtn" title="AI Producer">&#10024;</button>
</div>
</div>
</div>

<div id="newProjectModal" class="modal-overlay">
<div class="modal-sheet">
<div class="modal-title">New Project</div>
<input type="text" class="modal-input" id="projectNameInput" placeholder="Project name" maxlength="30">
<div class="modal-actions">
<button class="btn" id="cancelNewProject">Cancel</button>
<button class="btn btn-red" id="confirmNewProject">Create</button>
</div>
</div>
</div>

<div id="addTrackModal" class="modal-overlay">
<div class="modal-sheet action-sheet">
<div class="modal-title">Add Track</div>
<button class="action-btn" id="addEmptyTrack"><span>&#128444;</span> Empty Track</button>
<button class="action-btn" id="addMicTrack"><span>&#127908;</span> Record from Mic</button>
<button class="action-btn" id="addImportTrack"><span>&#128193;</span> Import Audio File</button>
<button class="action-btn cancel-btn" id="cancelAddTrack">Cancel</button>
</div>
</div>

<div id="pluginPickerModal" class="modal-overlay">
<div class="modal-sheet">
<div class="modal-title">Add Plugin</div>
<div id="pluginList"></div>
<div class="modal-actions">
<button class="btn" id="cancelPluginPicker">Cancel</button>
</div>
</div>
</div>

<div id="aiPanel" class="ai-panel">
<h4>&#10024; AI Producer</h4>
<p id="aiText">Tap the sparkles button for suggestions.</p>
<div class="ai-actions">
<button class="btn" id="dismissAi">Dismiss</button>
<button class="btn btn-red" id="applyAi">Apply</button>
</div>
</div>

<div id="exportModal" class="modal-overlay">
<div class="modal-sheet">
<div class="modal-title">Export Project</div>
<div class="export-option" id="exportWav">
<div class="progress-ring"><svg width="48" height="48" viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="wavProgress" cx="24" cy="24" r="20"/></svg><div class="progress-text" id="wavText">WAV</div></div>
<div><h4>WAV Export</h4><p>Uncompressed, highest quality</p></div>
</div>
<div class="export-option" id="exportM4a">
<div class="progress-ring"><svg width="48" height="48" viewBox="0 0 48 48"><circle class="bg" cx="24" cy="24" r="20"/><circle class="fg" id="m4aProgress" cx="24" cy="24" r="20"/></svg><div class="progress-text" id="m4aText">M4A</div></div>
<div><h4>M4A Export</h4><p>Compressed, share-friendly</p></div>
</div>
<div class="modal-actions"><button class="btn" id="cancelExport">Close</button></div>
</div>
</div>

<div id="toast" class="toast"></div>
<input type="file" id="fileInput" accept="audio/*" class="hidden">

<script>
(function() {

const $ = function(q) { return document.querySelector(q); };
const $$ = function(q) { return document.querySelectorAll(q); };

const store = {
  get: function(k) { try { return JSON.parse(localStorage.getItem('bs_' + k)); } catch(e) { return null; } },
  set: function(k, v) { localStorage.setItem('bs_' + k, JSON.stringify(v)); }
};

const COLORS = ['#ff3333', '#3b82f6', '#22c55e', '#eab308', '#a855f7', '#ec4899', '#06b6d4', '#f97316'];

const PLUGIN_DEFS = {
  vocalChain: { name: 'Vocal Chain', cat: 'Rapper', params: { preamp: 0, compression: 50, presence: 60, deEss: 40 } },
  rapperEq: { name: 'Rapper EQ', cat: 'Rapper', params: { lowCut: 30, body: 50, clarity: 60, air: 40 } },
  adLibDoubler: { name: 'Ad-Lib Doubler', cat: 'Rapper', params: { width: 50, detune: 20, delay: 30, mix: 50 } },
  drive808: { name: '808 Drive', cat: 'Bass', params: { drive: 40, tone: 50, blend: 60, lowBoost: 50 } },
  dynamics: { name: 'Dynamics', cat: 'Utility', params: { threshold: -24, ratio: 4, attack: 10, release: 100 } },
  tapeSat: { name: 'Tape Sat', cat: 'Color', params: { saturation: 40, warmth: 50, hiss: 20, flutter: 15 } }
};

const MASTER_PRESETS = {
  balanced: { name: 'Balanced', desc: 'Clean, transparent' },
  loud: { name: 'Loud & Punchy', desc: 'Aggressive, club-ready' },
  warm: { name: 'Warm Vintage', desc: 'Analog warmth, rolled highs' },
  bright: { name: 'Bright Streaming', desc: 'Optimized for Spotify/Apple Music' }
};

let audioCtx = null, masterGain = null, masterLimiter = null, analyser = null;
let recorder = null, recChunks = [];
let isPlaying = false, isRecording = false, startTime = 0, animationId = null;
let currentProjectId = null, project = null;
let history = [], historyIndex = -1;
let currentTab = 'tracks', selectedTrackForPlugin = null;

function findTrackByType(type) {
  if (!project || !project.tracks) return null;
  return project.tracks.find(function(t) { return t.name.toLowerCase().includes(type); });
}

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    masterGain = audioCtx.createGain();
    masterLimiter = audioCtx.createDynamicsCompressor();
    masterLimiter.threshold.value = -0.5;
    masterLimiter.knee.value = 0;
    masterLimiter.ratio.value = 20;
    masterLimiter.attack.value = 0.001;
    masterLimiter.release.value = 0.1;
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    masterGain.connect(masterLimiter);
    masterLimiter.connect(analyser);
    analyser.connect(audioCtx.destination);
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2000);
}

function generateId() {
  return Date.now().toString(36) + Math.random().toString(36).substr(2, 5);
}

function createDemoProject() {
  return {
    id: generateId(), name: 'Trap Beat Demo', created: Date.now(), modified: Date.now(), masterPreset: 'balanced',
    tracks: [
      { id: generateId(), name: '808 Bass', color: COLORS[0], volume: 0.82, pan: 0, mute: false, solo: false, armed: false, plugins: [], buffer: null, duration: 8 },
      { id: generateId(), name: 'Kick Drum', color: COLORS[1], volume: 0.82, pan: 0, mute: false, solo: false, armed: false, plugins: [], buffer: null, duration: 8 },
      { id: generateId(), name: 'Hi-Hats', color: COLORS[2], volume: 0.7, pan: 0.2, mute: false, solo: false, armed: false, plugins: [], buffer: null, duration: 8 },
      { id: generateId(), name: 'Lead Vocal', color: COLORS[3], volume: 0.9, pan: 0, mute: false, solo: false, armed: false, plugins: [], buffer: null, duration: 8 }
    ]
  };
}

function createProject(name) {
  return { id: generateId(), name: name || 'Untitled', created: Date.now(), modified: Date.now(), masterPreset: 'balanced', tracks: [] };
}

function createTrack(name, type) {
  const typeMap = { vocal: 3, '808': 0, bass: 0, kick: 1, drum: 1, hat: 2, hihat: 2 };
  const colorIdx = typeMap[type] !== undefined ? typeMap[type] : Math.floor(Math.random() * COLORS.length);
  return { id: generateId(), name: name || 'New Track', color: COLORS[colorIdx % COLORS.length], volume: 0.82, pan: 0, mute: false, solo: false, armed: false, plugins: [], buffer: null, duration: 0 };
}

function saveState() {
  if (!project) return;
  project.modified = Date.now();
  const projects = store.get('projects') || {};
  projects[project.id] = project;
  store.set('projects', projects);
  renderHome();
}

function pushHistory() {
  if (!project) return;
  history = history.slice(0, historyIndex + 1);
  history.push(JSON.parse(JSON.stringify(project)));
  if (history.length > 40) history.shift();
  else historyIndex++;
  saveState();
}

function undo() {
  if (historyIndex > 0) {
    historyIndex--;
    project = JSON.parse(JSON.stringify(history[historyIndex]));
    saveState();
    renderCurrentTab();
    showToast('Undo');
  } else {
    showToast('Nothing to undo');
  }
}

function redo() {

function generateWaveform(track, w, h) {
  const c = document.createElement('canvas');
  c.width = w || 300; c.height = h || 80;
  const ctx = c.getContext('2d');
  ctx.fillStyle = '#0a0a0a';
  ctx.fillRect(0, 0, c.width, c.height);
  if (track.buffer && track.buffer.length) {
    const data = track.buffer;
    const step = Math.ceil(data.length / c.width);
    const amp = c.height / 2;
    ctx.fillStyle = '#ff3333';
    for (let i = 0; i < c.width; i++) {
      let min = 1, max = -1;
      for (let j = 0; j < step; j++) {
        const s = data[i * step + j] || 0;
        if (s < min) min = s;
        if (s > max) max = s;
      }
      const h2 = (max - min) * amp * 0.8;
      ctx.fillRect(i, amp - (max * amp * 0.8), 1, h2);
    }
    return c;
  }
  const bars = Math.floor(c.width / 4);
  const amp = c.height / 2;
  ctx.fillStyle = '#ff3333';
  for (let i = 0; i < bars; i++) {
    const h2 = Math.random() * c.height * 0.6 + c.height * 0.1;
    ctx.globalAlpha = 0.3 + 0.7 * Math.random();
    ctx.fillRect(i * 4 + 1, amp - h2 / 2, 2, h2);
  }
  ctx.globalAlpha = 1;
  return c;
}

function updateScrub(clientX, wave, track) {
  const rect = wave.getBoundingClientRect();
  const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  track.playhead = x;
  const ph = wave.querySelector('.playhead');
  if (ph) ph.style.left = (x * 100) + '%';
}

  track.plugins.push({ type: type, params: newParams });
  updatePluginNodes(track);
}

function toggleTrackPlay(track, btn) {
  if (track.isPlaying) {
    track.isPlaying = false;
    btn.classList.remove('playing');
    btn.innerHTML = '&#9654;';
  } else {
    project.tracks.forEach(function(t) { t.isPlaying = false; });
    $$('.track-mini-play').forEach(function(b) { b.classList.remove('playing'); b.innerHTML = '&#9654;'; });
    track.isPlaying = true;
    btn.classList.add('playing');
    btn.innerHTML = '&#9208;';
  }
}

function toggleGlobalPlay() {
  isPlaying = !isPlaying;
  const playBtn = document.getElementById('playBtn');
  const playIcon = document.getElementById('playIcon');
  const pauseIcon = document.getElementById('pauseIcon');
  if (isPlaying) {
    playBtn.classList.add('playing');
    playIcon.classList.add('hidden');
    pauseIcon.classList.remove('hidden');
    startTime = audioCtx ? audioCtx.currentTime : 0;
    animate();
  } else {
    playBtn.classList.remove('playing');
    playIcon.classList.remove('hidden');
    pauseIcon.classList.add('hidden');
    cancelAnimationFrame(animationId);
  }
}

function animate() {
  if (!isPlaying) return;
  const now = audioCtx ? audioCtx.currentTime : 0;
  const elapsed = now - startTime;
  const ms = Math.floor((elapsed % 1) * 100);
  const s = Math.floor(elapsed % 60);
  const m = Math.floor(elapsed / 60);
  document.getElementById('timeDisplay').textContent =
    (m < 10 ? '0' : '') + m + ':' + (s < 10 ? '0' : '') + s + ':' + (ms < 10 ? '0' : '') + ms;
  project.tracks.forEach(function(t) {
    if (t.isPlaying || isPlaying) {
      const ph = document.getElementById('ph-' + t.id);
      if (ph) {
        const prog = (elapsed % Math.max(t.duration || 8, 1)) / (t.duration || 8);
        ph.style.left = (prog * 100) + '%';
      }
    }
  });
  if (analyser) {
    const data = new Uint8Array(analyser.frequencyBinCount);
    analyser.getByteFrequencyData(data);
    const half = Math.floor(data.length / 2);
    const l = data.slice(0, half);
    const r = data.slice(half);
    const avgL = l.reduce(function(a, b) { return a + b; }, 0) / l.length;
    const avgR = r.reduce(function(a, b) { return a + b; }, 0) / r.length;
    const ml = document.getElementById('meterL');
    const mr = document.getElementById('meterR');
    const db = document.getElementById('dbReadout');
    if (ml) ml.style.height = Math.min(avgL / 255 * 100, 100) + '%';
    if (mr) mr.style.height = Math.min(avgR / 255 * 100, 100) + '%';
    if (db) {
      const dbL = avgL > 0 ? 20 * Math.log10(avgL / 255) : -Infinity;
      db.textContent = (dbL === -Infinity ? '-inf' : dbL.toFixed(1)) + ' dB';
    }
  }
  animationId = requestAnimationFrame(animate);
}

function startRecording() {
  initAudio();
  if (!audioCtx) return;
  navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream) {
    recorder = new MediaRecorder(stream);
    recChunks = [];
    recorder.ondataavailable = function(e) { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = function() {
      const blob = new Blob(recChunks, { type: 'audio/webm' });
      const reader = new FileReader();
      reader.onload = function() {
        audioCtx.decodeAudioData(reader.result, function(buffer) {
          const track = createTrack('Recorded Vocal', 'vocal');
          track.buffer = buffer.getChannelData(0);
          track.duration = buffer.duration;
          project.tracks.push(track);
          renderCurrentTab();
          pushHistory();
          showToast('Recording added');
        });
      };
      reader.readAsArrayBuffer(blob);
    };
    recorder.start();
    isRecording = true;
    document.getElementById('recBtn').classList.add('recording');
    document.getElementById('recBadge').classList.add('show');
    showToast('Recording...');
  }).catch(function() { showToast('Mic access denied'); });
}

function stopRecording() {
  if (recorder && recorder.state !== 'inactive') recorder.stop();
  isRecording = false;
  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recBadge').classList.remove('show');
}

function importAudio(file) {
  initAudio();
  const reader = new FileReader();
  reader.onload = function() {
    audioCtx.decodeAudioData(reader.result, function(buffer) {
      const track = createTrack(file.name.replace(/[^a-z0-9]/gi, ' ').substr(0, 20) || 'Imported', 'vocal');
      track.buffer = buffer.getChannelData(0);
      track.duration = buffer.duration;
      project.tracks.push(track);
      renderCurrentTab();
      pushHistory();
      showToast('Audio imported');
    });
  };
  reader.readAsArrayBuffer(file);
}

function exportProject(format) {
  const progress = document.getElementById(format + 'Progress');
  const text = document.getElementById(format + 'Text');
  let pct = 0;
  const interval = setInterval(function() {
    pct += Math.random() * 15 + 5;
    if (pct >= 100) {
      pct = 100;
      clearInterval(interval);
      text.textContent = 'Done';
      setTimeout(function() {
        text.textContent = format.toUpperCase();
        progress.style.strokeDashoffset = 126;
      }, 1500);
      const blob = new Blob([''], { type: format === 'wav' ? 'audio/wav' : 'audio/mp4' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = project.name + '.' + format;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Export complete');
    }
    progress.style.strokeDashoffset = 126 - (pct / 100 * 126);
    text.textContent = Math.floor(pct) + '%';
  }, 200);
}

function applyAiTip(index) {
  if (index === 0) {
    const t = findTrackByType('vocal') || (project && project.tracks[0]);
    if (t) { addPluginToTrack(t, 'vocalChain'); showToast('Vocal Chain added'); }
  } else if (index === 1) {
    const t = findTrackByType('808') || (project && project.tracks.find(function(x) { return x.name.toLowerCase().includes('bass'); })) || (project && project.tracks[0]);
    if (t) { addPluginToTrack(t, 'drive808'); showToast('808 Drive added'); }
  } else if (index === 2) {
    project.masterPreset = 'loud';
    applyMasterPreset('loud');
    showToast('Loud & Punchy applied');
  } else if (index === 3) {
    autoMix();
    showToast('AutoMix applied');
  } else if (index === 4) {
    project.masterPreset = 'warm';
    applyMasterPreset('warm');
    showToast('Warm Vintage applied');
  } else if (index === 5) {
    const t = findTrackByType('vocal') || (project && project.tracks[0]);
    if (t) { addPluginToTrack(t, 'rapperEq'); showToast('Rapper EQ added'); }
  } else if (index === 6) {
    const t = project && project.tracks.reduce(function(a, b) { return a.volume > b.volume ? a : b; }, project.tracks[0]);
    if (t) { addPluginToTrack(t, 'dynamics'); showToast('Dynamics added'); }
  }
}

const AI_TIPS = [
  'Add a Vocal Chain to your lead vocal track for more presence.',
  'Boost the 808 with Drive and Low Boost for more weight.',
  'Apply Loud & Punchy master preset for club-ready sound.',
  'Use AutoMix to balance all tracks at 82% volume.',
  'Add Tape Saturation to your master bus for analog warmth.',
  'Boost clarity on vocals with Rapper EQ.',
  'Add Dynamics compression to control peaks on loud tracks.'
];

let currentAiTip = 0;

function generateAiTip() {
  currentAiTip = Math.floor(Math.random() * AI_TIPS.length);
  document.getElementById('aiText').textContent = AI_TIPS[currentAiTip];
}

document.getElementById('newProjectBtn').addEventListener('click', function() {
  document.getElementById('projectNameInput').value = '';
  openModal('newProjectModal');
  document.getElementById('projectNameInput').focus();
});

document.getElementById('cancelNewProject').addEventListener('click', function() { closeModal('newProjectModal'); });

document.getElementById('confirmNewProject').addEventListener('click', function() {
  const name = document.getElementById('projectNameInput').value.trim() || 'Untitled';
  project = createProject(name);
  currentProjectId = project.id;
  history = [JSON.parse(JSON.stringify(project))];
  historyIndex = 0;
  saveState();
  document.getElementById('studioTitle').textContent = project.name;
  closeModal('newProjectModal');
  showScreen('studioScreen');
  renderCurrentTab();
  initAudio();
});

document.getElementById('backBtn').addEventListener('click', function() { saveState(); showScreen('homeScreen'); });

document.getElementById('exportBtn').addEventListener('click', function() { openModal('exportModal'); });

document.getElementById('cancelExport').addEventListener('click', function() { closeModal('exportModal'); });

document.getElementById('exportWav').addEventListener('click', function() { exportProject('wav'); });

document.getElementById('exportM4a').addEventListener('click', function() { exportProject('m4a'); });

document.getElementById('undoBtn').addEventListener('click', undo);

document.getElementById('redoBtn').addEventListener('click', redo);

document.getElementById('playBtn').addEventListener('click', toggleGlobalPlay);

document.getElementById('recBtn').addEventListener('click', function() {
  if (isRecording) stopRecording();
  else startRecording();
});

document.getElementById('addTrackBtn').addEventListener('click', function() { openModal('addTrackModal'); });

document.getElementById('cancelAddTrack').addEventListener('click', function() { closeModal('addTrackModal'); });

document.getElementById('addEmptyTrack').addEventListener('click', function() {
  project.tracks.push(createTrack('New Track', ''));
  renderCurrentTab();
  pushHistory();
  closeModal('addTrackModal');
});

document.getElementById('addMicTrack').addEventListener('click', function() {
  closeModal('addTrackModal');
  startRecording();
});

document.getElementById('addImportTrack').addEventListener('click', function() {
  document.getElementById('fileInput').click();
  closeModal('addTrackModal');
});

document.getElementById('fileInput').addEventListener('change', function(e) {
  if (e.target.files[0]) importAudio(e.target.files[0]);
});

document.getElementById('micBtn').addEventListener('click', function() {
  const t = createTrack('Mic Track', 'vocal');
  t.armed = true;
  project.tracks.push(t);
  renderCurrentTab();
  pushHistory();
  showToast('Mic track armed');
});

document.getElementById('aiBtn').addEventListener('click', function() {
  document.getElementById('aiPanel').classList.toggle('show');
  if (document.getElementById('aiPanel').classList.contains('show')) generateAiTip();
});

document.getElementById('dismissAi').addEventListener('click', function() {
  document.getElementById('aiPanel').classList.remove('show');
});

document.getElementById('applyAi').addEventListener('click', function() {
  applyAiTip(currentAiTip);
  document.getElementById('aiPanel').classList.remove('show');
});

document.getElementById('cancelPluginPicker').addEventListener('click', function() { closeModal('pluginPickerModal'); });

$$('.tab-btn').forEach(function(btn) {
  btn.addEventListener('click', function() {
    $$('.tab-btn').forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
    currentTab = btn.dataset.tab;
    renderCurrentTab();
  });
});

document.addEventListener('keydown', function(e) {
  if (e.key === ' ') {
    e.preventDefault();
    toggleGlobalPlay();
  } else if (e.metaKey && e.key === 'z') {
    e.preventDefault();
    if (e.shiftKey) redo();
    else undo();
  }
});

window.addEventListener('DOMContentLoaded', function() {
  const projects = getProjects();
  if (!Object.keys(projects).length) {
    const demo = createDemoProject();
    projects[demo.id] = demo;
    store.set('projects', projects);
  }
  renderHome();
  setTimeout(function() {
    document.getElementById('splash').style.opacity = '0';
    setTimeout(function() {
      document.getElementById('splash').style.display = 'none';
    }, 800);
  }, 1500);
});

})();
</script>
