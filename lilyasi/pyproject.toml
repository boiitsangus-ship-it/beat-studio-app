[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lilyasi-runtime"
version = "0.2.0"
description = "Local-first Jarvis orchestration runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
backup = ["cryptography>=42"]
test = ["pytest>=8", "cryptography>=42"]

[project.scripts]
lilyasi = "lilyasi.main:main"

[tool.setuptools]
packages = ["lilyasi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
